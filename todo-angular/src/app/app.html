<main class="page">
  <section class="todo-card">
    <header>
      <p class="eyebrow">Angular</p>
  
      <h1>Lista de Tarefas</h1>
      <p>Organize suas atividades e matenha os dadaos salvos no navegador.</p>
    </header>

    <app-todo-form (todoAdded)="store.add($event)" />

    <app-todo-list
      [todos]="store.todos()"
      (todoToggled)="store.toggle($event)"
      (todoRemoved)="store.remove($event)"
    />
  </section>
</main>
